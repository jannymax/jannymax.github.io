<!DOCTYPE html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>KikiDub · Support</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fffaf7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.7}main{max-width:560px;margin:12vh auto;padding:32px 24px}.brand{color:#174b56;font-weight:700}h1{font-size:26px;line-height:1.4;margin:32px 0 16px}p{color:#555}a{display:inline-block;margin-top:20px;padding:12px 24px;border-radius:24px;background:#174b56;color:white;text-decoration:none}a:focus-visible{outline:3px solid #e28a31;outline-offset:4px}</style></head>
<body><main><div class="brand">KikiDub</div><h1 id="title">此表单已停止使用</h1><p id="message">如需帮助或反馈，请使用 KikiDub 支持页面。</p><a id="support" href="kikidub-support.html">联系支持</a></main>
<script>
const translations={"zh": ["zh-Hans", "此表单已停止使用", "如需帮助或反馈，请使用 KikiDub 支持页面。", "联系支持"], "en": ["en", "This form is no longer available", "For help or feedback, please visit KikiDub Support.", "Contact support"], "ja": ["ja", "このフォームは受付を終了しました", "お問い合わせやご意見は、KikiDubのサポートページからお寄せください。", "サポートへ"], "es": ["es", "Este formulario ya no está disponible", "Si necesitas ayuda o quieres enviar comentarios, visita la página de soporte de KikiDub.", "Contactar con soporte"], "fr": ["fr", "Ce formulaire n’est plus disponible", "Pour obtenir de l’aide ou nous faire part de vos commentaires, consultez la page d’assistance KikiDub.", "Contacter l’assistance"]};
const requested=new URLSearchParams(location.search).get('lang')||navigator.language||'zh';
const language=requested.toLowerCase().split(/[-_]/)[0];
